description:
  en-US:
    localisedName: ANNCSU-PostgreSQL-PDND-sync
    shortDescription: PDND authentication client and ANNCSU address synchronization tool
    longDescription: PHP script that manages the submission and update of address
      coordinates to the ANNCSU database using PostgreSQL/PostGIS data
      extraction and OAuth2 authentication. It logs all operations performed
      during the synchronization process.
    documentation: https://github.com/ComuneMontelupoFiorentino/ANNCSU-PostgreSQL-PDND-sync
    features:
      - Test and Production Environment Management
      - OAuth 2.0 Authentication with JWT Bearer Token
      - Extracting data from a PostgreSQL database
      - Submission of House Number Coordinates to ANNCSU
      - Adding, Updating, and Deleting House Numbers from ANNCSU
      - Complete operation log
      - Updating a PostgreSQL table using a feed
