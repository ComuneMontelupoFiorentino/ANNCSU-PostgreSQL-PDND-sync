description:
  it-IT:
    localisedName: ANNCSU-PostgreSQL-PDND-sync
    shortDescription: Client per autenticazione PDND e conferimento/aggiornamento dati ANNCSU
    longDescription: " Script in linguaggio PHP in grado di gestire le operazioni di
      conferimento delle coordinate dei civici o l'aggiornamento, inserimento o
      eliminazione dei civici stessi su DB ANNCSU. Lo script estrae da DB
      PostGIS un elenco di record corrispondenti ai civici che si vogliono
      aggiornare. Le operazioni svolte sono dettagliate in uno specifico file di
      log generato al termine del processo di conferimento."
    documentation: https://github.com/ComuneMontelupoFiorentino/ANNCSU-PostgreSQL-PDND-sync
    features:
      - Gestione ambiente di test e di produzione
      - Autenticazione OAuth2 con JWT Bearer Token
      - Estrazione dati da DB PostgreSQL
      - Conferimento Coordinate dei civici ad ANNCSU
      - Inserimento, Aggiornamento, Eliminazione civici da ANNCSU
      - Log completo delle operazioni
      - Aggiornamento tabella PostgreSQL con feed
